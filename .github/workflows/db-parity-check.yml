name: Database Parity Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded runs of the SAME pull request only; pushes to main and
# scheduled runs are never cancelled (#1326).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Deterministic pool for CI. 2 GiB: ladybug 0.20.x exhausts a 1 GiB pool on
  # the parity fixture, while the unconstrained 4 GiB default faulted natively
  # on runners sharing memory with the Neo4j container.
env:
  CGC_EMBEDDED_BUFFER_POOL_MB: "2048"
  # Temporary #1710 diagnostic: prints LBG_DIAG match counts for the helpers.go batch
  CGC_LBG_DIAG: "1"
  # The parity suite starts Neo4j and NornicDB with testcontainers (see tests/parity/conftest.py).
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  db-parity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,parsing]

      - name: Run live-database parity suite (Docker)
        env:
          CGC_PARITY_DIAGNOSTICS_DIR: ${{ runner.temp }}/cgc-parity-diagnostics
        run: |
          pytest tests/parity/ -m parity -v -s

      - name: Upload containment parity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: containment-parity-${{ github.run_id }}
          path: ${{ runner.temp }}/cgc-parity-diagnostics/*.json
          if-no-files-found: warn
          retention-days: 14
